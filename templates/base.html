<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="MindSphere - AI-Powered Mental Health Prediction, Early Risk Detection and Explainable Insights.">
    <meta name="theme-color" content="#0d9488">
    <title>MindSphere - Mental Health AI</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='brain.png') }}">
    
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom Design System -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- SITE HEADER / NAVBAR -->
    <header class="site-header">
        <div class="container navbar">
            <a href="/" class="brand" aria-label="MindSphere Home">
                <div class="brand-icon">
                    <i class="fas fa-brain"></i>
                </div>
                <span class="brand-name">Mind<span>Sphere</span></span>
            </a>

            <!-- Desktop Nav Links -->
            <nav class="nav-links" aria-label="Desktop Navigation">
                {% if current_user.is_authenticated %}
                    <a href="/" class="nav-link">Home</a>
                    <a href="{{ url_for('dashboard') }}" class="nav-link">Assessment</a>
                    <a href="{{ url_for('history') }}" class="nav-link">My History</a>
                    <span class="nav-divider">|</span>
                    <span class="user-chip">
                        <i class="fas fa-user-circle"></i>
                        {{ current_user.username }}
                    </span>
                    <a href="{{ url_for('logout') }}" class="nav-link logout-link">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                {% else %}
                    <a href="/" class="nav-link">Home</a>
                    <a href="/#features" class="nav-link">Features</a>
                    <a href="/#about" class="nav-link">About</a>
                    <a href="{{ url_for('login') }}" class="nav-link">Login</a>
                    <a href="{{ url_for('register') }}" class="btn btn-primary btn-sm">Get Started</a>
                {% endif %}
            </nav>
