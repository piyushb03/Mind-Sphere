{% extends "base.html" %}
{% block content %}
<div class="container container-sm">
    <div class="auth-card">
        <div class="auth-header">
            <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.4rem;">
                <i class="fas fa-brain"></i>
            </div>
            <h2>Create Account</h2>
            <p>Join MindSphere to track your mental well-being over time.</p>
        </div>
        
        <form method="POST" id="registerForm">
            <div class="form-group">
                <label for="reg-username">Full Name or Username</label>
                <input type="text" id="reg-username" name="username" required placeholder="e.g. John Doe" autocomplete="name">
            </div>

            <div class="form-group">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" name="email" required placeholder="name@example.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" name="password" required placeholder="Create a secure password" autocomplete="new-password">
            </div>

            <!-- Terms & Privacy Agreement -->
            <div class="terms-checkbox-wrapper">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">
